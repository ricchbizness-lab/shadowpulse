name: Deploy to GitHub Pages

# IMPORTANT — DEPLOYMENT BRANCH
# This workflow MUST trigger on 'claude/git-ux-ui-design-pro-rmvd0w' only.
# GitHub reads the trigger from the *pushed commit's* workflow file, so if this
# branch name is changed here (e.g. after a rebase that brings in commits from
# feature/shadow-pulse-pipeline), pushes to the deploy branch will silently stop
# firing. Always verify this matches the branch you are pushing to.
# The GitHub Pages environment is scoped to this branch — other branches will
# fail at the deploy job even if the build succeeds.
on:
  push:
    branches: [claude/git-ux-ui-design-pro-rmvd0w]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
